<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11110f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="胶片"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./icon.svg"><link rel="apple-touch-icon" href="icon.svg"><title>胶片 · Jiaopian</title><style>:root{color-scheme:dark;--bg:#11110f;--panel:#1b1b18;--line:#34342f;--muted:#99998e;--cream:#e9e4d8;--accent:#d6c8a7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.app{max-width:540px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px 22px;display:flex;flex-direction:column}header{height:60px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:20px;letter-spacing:.2em;font-weight:600}.sub{font:9px monospace;color:var(--muted);letter-spacing:.16em}main{flex:1;padding:14px 0}.finder{position:relative;background:#080807;border:1px solid #292923;border-radius:15px;overflow:hidden;aspect-ratio:4/5;max-height:58vh;display:flex;align-items:center;justify-content:center}video,#preview{position:absolute;width:100%;height:100%;inset:0;object-fit:cover}video{transform:none}#preview{display:none}.finder:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,.24) 100%);z-index:1}.overlay{position:absolute;inset:12%;border:1px solid #ffffff33;pointer-events:none}.top,.bottom{position:absolute;left:14px;right:14px;display:flex;justify-content:space-between;font:10px monospace;text-shadow:0 1px 5px #000}.top{top:14px}.bottom{bottom:14px}#message{z-index:2;text-align:center;color:#aaa;padding:24px;max-width:290px}#message b{color:var(--cream)}#message p{font-size:12px;line-height:1.6}.stock,.row,.tabs{display:flex;align-items:center;justify-content:space-between;gap:8px}.stock{margin:12px 0;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}.stock small{display:block;color:var(--muted);margin-top:4px}select,button{font:inherit}select{background:var(--panel);color:var(--cream);border:1px solid var(--line);border-radius:8px;padding:8px;max-width:150px}.row{margin:12px 0}.row label{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.shutter{width:68px;height:68px;border-radius:50%;border:2px solid var(--cream);background:var(--accent);box-shadow:inset 0 0 0 5px var(--bg)}.action,.ghost{padding:10px 14px;border-radius:9px}.action{border:0;background:var(--cream);color:#171713}.ghost{border:1px solid var(--line);background:none;color:var(--cream)}.tabs{border-top:1px solid var(--line);padding-top:12px}.tabs button{flex:1;background:none;border:1px solid transparent;color:var(--muted);padding:10px 2px;border-radius:8px}.tabs button.active{background:var(--panel);border-color:var(--line);color:var(--cream)}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px}.muted{color:var(--muted);font-size:11px}.viewer{display:none;position:fixed;inset:0;z-index:20;background:#080807;align-items:center;justify-content:center;padding:18px}.viewer.open{display:flex}.viewer img{max-width:100%;max-height:82vh;object-fit:contain}.viewer button{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px;background:#222;border:1px solid #555;color:#fff;border-radius:20px;padding:10px 16px}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#eee8d9;color:#171713;padding:10px 16px;border-radius:20px;font-size:12px;display:none;z-index:9}</style></head><body><div class="app"><header><div><div class="brand">胶片</div><div class="sub">JIAOPIAN · ANALOG CAMERA</div></div><button class="ghost" id="flip">切换镜头</button></header><main><section class="page active" id="cameraPage"><div class="finder"><video id="video" autoplay playsinline muted></video><img id="preview"><div id="exposureLayer" style="position:absolute;inset:0;pointer-events:none;z-index:1;background:transparent"></div><div class="overlay"></div><div class="top"><span>● JIAOPIAN 01</span><span id="clock"></span></div><div class="bottom"><span id="filmLabel">KODAK GOLD 200</span><span id="count">00 / 36</span></div><div id="message"><b>准备好拍一卷照片了吗？</b><p>请通过 HTTPS 打开，并允许 Safari 使用相机。</p><button class="action" id="start">开启相机</button></div></div><div class="stock"><div><strong id="filmName">KODAK GOLD 200</strong><small id="filmDesc">温暖色调 · 柔和颗粒</small></div><select id="film"><option value="gold">Kodak Gold 200</option><option value="portra">Portra 400</option><option value="mono">Tri-X 400</option><option value="chrome">Classic Chrome</option><option value="fade">Vintage Fade</option><option value="ektar">Kodak Ektar 100</option><option value="velvia">Fuji Velvia 50</option><option value="classicneg">Fuji Classic Neg</option><option value="cinestill">CineStill 800T</option><option value="hp5">Ilford HP5 400</option><option value="portra800">Portra 800</option></select></div><div class="row"><div><label>ISO</label><select id="iso"><option>100</option><option selected>200</option><option>400</option><option>800</option></select></div><button class="shutter" id="shoot" aria-label="拍照"></button><div><label>曝光 EV</label><select id="ev"><option value="-1">-1.0</option><option value="0" selected>0.0</option><option value="1">+1.0</option></select></div></div><div class="row"><span class="muted" id="status">相机尚未启动</span></div><div class="row"><div><label>水印样式</label><select id="watermark"><option value="full">完整信息</option><option value="date">仅日期</option><option value="settings">ISO + EV</option><option value="camera">相机铭牌</option><option value="film">胶片型号</option><option value="off">关闭水印</option></select></div><div><label>模拟相机</label><select id="cameraBrand"><option>LEICA M6</option><option>LEICA Q</option><option>CONTAX T2</option><option>CONTAX G2</option><option>FUJIFILM X100</option><option>FUJIFILM X-PRO</option><option>KODAK RETINA</option><option>KODAK M35</option><option>CINESTILL 800T</option><option>JIAOPIAN 35</option></select></div></div></section><section class="page" id="albumPage"><div class="row"><b>照片档案</b><span class="muted" id="total">0 张</span></div><div class="grid" id="photos"></div><p class="muted" id="empty">拍摄的照片会保存在这里。</p></section><section class="page" id="settingsPage"><b>使用说明</b><p class="muted">照片保存在当前浏览器的本地数据库中。清除网站数据可能导致照片丢失，请及时保存照片。</p><p class="muted">ISO 和 EV 用于视觉模拟及拍摄记录，不会真实控制 iPhone 相机硬件曝光。网页相机需要 HTTPS。</p><button class="ghost" id="export">导出照片索引</button></section></main><nav class="tabs"><button class="active" data-page="camera">相机</button><button data-page="album">档案</button><button data-page="settings">设置</button></nav></div><div class="viewer" id="viewer"><button id="closeViewer">返回档案</button><img id="viewerImage" alt="照片预览"></div><div class="toast" id="toast"></div><canvas id="canvas" hidden></canvas><script>const $=id=>document.getElementById(id);let stream=null,facing="environment",db;const films={gold:["KODAK GOLD 200","暖黄高饱和 · 金色阳光","sepia(.32) saturate(1.65) contrast(1.12)"],portra:["PORTRA 400","柔和肤色 · 低对比奶油感","sepia(.12) saturate(1.12) contrast(.82) brightness(1.08)"],mono:["TRI-X 400","经典黑白 · 强烈反差","grayscale(1) contrast(1.65) brightness(.96)"],chrome:["CLASSIC CHROME","冷调青蓝 · 低饱和纪实","saturate(.58) contrast(1.32) hue-rotate(-12deg)"],fade:["VINTAGE FADE","褪色复古 · 暖灰雾面","sepia(.48) saturate(.72) contrast(.78) brightness(1.12)"],ektar:["KODAK EKTAR 100","鲜艳浓郁 · 高饱和风景色彩","saturate(1.9) contrast(1.22)"],velvia:["FUJI VELVIA 50","浓烈红绿 · 反转片风格","saturate(2.05) contrast(1.28)"],classicneg:["FUJI CLASSIC NEG","青绿色阴影 · 暖红高光","sepia(.16) saturate(1.28) contrast(1.12) hue-rotate(-8deg)"],cinestill:["CINESTILL 800T","夜景冷蓝 · 暖色灯光氛围","saturate(1.25) contrast(1.18) hue-rotate(12deg)"],hp5:["ILFORD HP5 400","柔和黑白 · 细腻灰阶","grayscale(1) contrast(1.12) brightness(1.04)"],portra800:["PORTRA 800","暖调胶片 · 柔和高感颗粒","sepia(.18) saturate(1.18) contrast(.9) brightness(1.04)"]};const cameraProfiles={"LEICA M6":"hp5","LEICA Q":"chrome","CONTAX T2":"portra","CONTAX G2":"classicneg","FUJIFILM X100":"classicneg","FUJIFILM X-PRO":"velvia","KODAK RETINA":"gold","KODAK M35":"ektar","CINESTILL 800T":"cinestill","JIAOPIAN 35":"fade"};function say(s){$("toast").textContent=s;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2200)}function applyFilmPixels(ctx,w,h,key,ev){let im=ctx.getImageData(0,0,w,h),p=im.data;let sat=1,con=1,bright=Math.pow(2,ev),sep=0,mono=false,warm=0,cool=0;switch(key){case"gold":sat=1.48;con=1.08;sep=.22;warm=5;break;case"portra":sat=1.08;con=.88;sep=.1;bright*=1.04;warm=3;break;case"mono":case"hp5":mono=true;con=key==="mono"?1.55:1.12;break;case"chrome":sat=.62;con=1.25;cool=5;break;case"fade":sat=.72;con=.78;sep=.38;bright*=1.08;break;case"ektar":sat=1.72;con=1.18;break;case"velvia":sat=1.9;con=1.24;break;case"classicneg":sat=1.22;con=1.06;warm=4;cool=2;break;case"cinestill":sat=1.18;con=1.16;cool=7;warm=3;break;case"portra800":sat=1.14;con=.9;sep=.12;warm=4;break;}for(let i=0;i<p.length;i+=4){let r=p[i],g=p[i+1],b=p[i+2];if(mono){let y=.299*r+.587*g+.114*b;r=g=b=y}else{let y=.299*r+.587*g+.114*b;r=y+(r-y)*sat;g=y+(g-y)*sat;b=y+(b-y)*sat;if(sep){let sr=r*.393+g*.769+b*.189,sg=r*.349+g*.686+b*.168,sb=r*.272+g*.534+b*.131;r=r*(1-sep)+sr*sep;g=g*(1-sep)+sg*sep;b=b*(1-sep)+sb*sep}}r=(r-128)*con+128+warm-cool*.25;g=(g-128)*con+128+cool*.15;b=(b-128)*con+128+cool-warm*.35;r*=bright;g*=bright;b*=bright;p[i]=Math.max(0,Math.min(255,r));p[i+1]=Math.max(0,Math.min(255,g));p[i+2]=Math.max(0,Math.min(255,b))}ctx.putImageData(im,0,0)}function addAnalogTexture(ctx,w,h,iso,key){let im=ctx.getImageData(0,0,w,h),p=im.data,cx=w*.5,cy=h*.5,grain=iso>=800?10:iso>=400?7:iso>=200?4.5:3,edge=key==="mono"||key==="hp5"?.22:.16;for(let y=0;y<h;y++){let ny=(y-cy)/cy;for(let x=0;x<w;x++){let nx=(x-cx)/cx,rad=Math.min(1,nx*nx+ny*ny),v=1-edge*rad,idx=(y*w+x)*4,r=p[idx],g=p[idx+1],b=p[idx+2],lum=(r+g+b)/3,noise=(Math.random()-.5)*grain*(.55+lum/180);let halo=Math.max(0,(lum-218)/37)*.10;p[idx]=Math.max(0,Math.min(255,(r+noise+halo*24)*v));p[idx+1]=Math.max(0,Math.min(255,(g+noise-halo*2)*v));p[idx+2]=Math.max(0,Math.min(255,(b+noise-halo*5)*v))}}ctx.putImageData(im,0,0)}function updateLook(){let f=$("film").value,ev=Number($("ev").value),iso=Number($("iso").value);$("video").style.filter=films[f][2];let layer=$("exposureLayer");layer.style.background=ev<0?"#000":"#fff";layer.style.opacity=ev===0?"0":String(Math.min(.65,Math.abs(ev)*.5));$("status").textContent=stream?"实时预览 · ISO "+iso+" · EV "+(ev>0?"+":"")+ev.toFixed(1):"相机尚未启动 · 参数已选择"}function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open("JiaopianDB",1);r.onupgradeneeded=()=>r.result.createObjectStore("photos",{keyPath:"id"});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function all(){return new Promise(ok=>{let r=db.transaction("photos").objectStore("photos").getAll();r.onsuccess=()=>ok(r.result)})}function save(p){return new Promise((ok,no)=>{let r=db.transaction("photos","readwrite").objectStore("photos").add(p);r.onsuccess=ok;r.onerror=()=>no(r.error)})}async function camera(){try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("当前浏览器不支持网页相机");if(stream)stream.getTracks().forEach(t=>t.stop());$("message").style.display="block";$("status").textContent="正在启动相机…";stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});$("video").srcObject=stream;$("video").style.transform=facing==="user"?"scaleX(-1)":"none";$("message").style.display="none";updateLook()}catch(e){stream=null;$("message").style.display="block";$("status").textContent="相机尚未启动";say("相机无法启动："+e.message)}}async function shoot(){if(!stream)return say("请先开启相机");let v=$("video"),c=$("canvas"),ctx=c.getContext("2d");if(!v.videoWidth)return say("相机画面尚未准备好");c.width=v.videoWidth;c.height=v.videoHeight;if(facing==="user"){ctx.save();ctx.translate(c.width,0);ctx.scale(-1,1)}let f=$("film").value,ev=Number($("ev").value);ctx.filter="none";ctx.drawImage(v,0,0);if(facing==="user")ctx.restore();applyFilmPixels(ctx,c.width,c.height,f,ev);let iso=Number($("iso").value);addAnalogTexture(ctx,c.width,c.height,iso,f);let d=new Date(),wm=$("watermark").value,brand=$("cameraBrand").value;if(wm!=="off"){let dateText=d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0"),isoText="ISO "+$("iso").value,evValue=Number($("ev").value),evText="EV "+(evValue>0?"+":"")+evValue.toFixed(1),filmText=films[f][0],lines=[];if(wm==="date")lines=[dateText];if(wm==="settings")lines=[isoText+"  "+evText];if(wm==="camera")lines=[brand];if(wm==="film")lines=[filmText];if(wm==="full")lines=[brand+"  /  "+filmText,isoText+"  "+evText,dateText];let fs=Math.max(17,c.width*.022),lineH=fs*1.55,pad=fs*.8;ctx.save();ctx.font=fs+"px monospace";ctx.textAlign="right";ctx.textBaseline="bottom";let widest=Math.max(...lines.map(x=>ctx.measureText(x).width));let x=c.width-pad,y=c.height-pad;ctx.fillStyle="rgba(0,0,0,.42)";ctx.fillRect(c.width-widest-pad*1.6,c.height-(lines.length*lineH+pad*1.5),widest+pad*1.2,lines.length*lineH+pad*1.1);ctx.fillStyle="#fff0d2";lines.forEach((line,i)=>ctx.fillText(line,x,y-(lines.length-1-i)*lineH));ctx.restore()}let p={id:Date.now()+Math.random(),data:c.toDataURL("image/jpeg",.9),created:d.toISOString(),film:f,iso:+$("iso").value,ev:+$("ev").value};await save(p);let n=(await all()).length;$("count").textContent=String(n%36||36).padStart(2,"0")+" / 36";$("status").textContent="已保存 "+n+" 张";say("照片已保存");await refresh()}async function refresh(){let a=(await all()).sort((x,y)=>y.created.localeCompare(x.created));$("photos").innerHTML="";a.forEach(p=>{let i=document.createElement("img");i.src=p.data;i.onclick=()=>{$("viewerImage").src=p.data;$("viewer").classList.add("open")};$("photos").append(i)});$("total").textContent=a.length+" 张";$("empty").style.display=a.length?"none":"block"}document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$(b.dataset.page+"Page").classList.add("active");if(b.dataset.page==="album")refresh();if(b.dataset.page!=="camera"&&stream){stream.getTracks().forEach(t=>t.stop());stream=null;$("video").srcObject=null;$("message").style.display="block";$("status").textContent="相机已暂停 · 点击“相机”继续拍摄"}if(b.dataset.page==="camera")camera()});$("closeViewer").onclick=()=>$("viewer").classList.remove("open");$("viewer").onclick=e=>{if(e.target===$("viewer"))$("viewer").classList.remove("open")};$("start").onclick=camera;$("shoot").onclick=shoot;$("flip").onclick=()=>{facing=facing==="environment"?"user":"environment";if(stream)camera()};$("film").onchange=()=>{$("filmName").textContent=films[$("film").value][0];$("filmDesc").textContent=films[$("film").value][1];$("filmLabel").textContent=films[$("film").value][0];updateLook()};$("cameraBrand").onchange=()=>{$("film").value=cameraProfiles[$("cameraBrand").value]||"gold";$("filmName").textContent=films[$("film").value][0];$("filmDesc").textContent=films[$("film").value][1];$("filmLabel").textContent=films[$("film").value][0];updateLook();say("已匹配 "+films[$("film").value][0]+" 色彩")};$("iso").onchange=updateLook;$("ev").onchange=updateLook;$("export").onclick=async()=>{let a=await all(),blob=new Blob([JSON.stringify(a.map(({data,...x})=>x),null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),l=document.createElement("a");l.href=u;l.download="jiaopian-index.json";l.click();URL.revokeObjectURL(u)};$("clock").textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});updateLook();(async()=>{try{db=await openDB();await refresh()}catch(e){say("本地数据库初始化失败")}})();if("serviceWorker"in navigator&&location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));</script></body></html>
